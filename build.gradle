plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	maven {
		name = "TerraBlender"
		url = "https://maven.minecraftforge.net/"
		content { includeGroup "com.github.glitchfiend" }
	}
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter { includeGroup "maven.modrinth" }
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"tears-of-ink" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	configureDataGeneration {
		client = true
		modId = "tears-of-ink"
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// TerraBlender — встраивание биомов в мир (уже есть в сборке как зависимость Biomes O' Plenty)
	modImplementation "com.github.glitchfiend:TerraBlender-fabric:${project.terrablender_version}"

	// Только для запуска из IntelliJ: Sodium + Iris, как в общей сборке.
	// В наш .jar и в зависимости мода они НЕ попадают.
	modLocalRuntime "maven.modrinth:sodium:${project.sodium_version}"
	modLocalRuntime "maven.modrinth:iris:${project.iris_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

// ===== Шейдерпак для тестов: Complementary Reimagined =====
// Запуск: панель Gradle → Tasks → tears of ink → installShaderpack (один раз).
// Кладёт шейдерпак в run/shaderpacks и включает его в Iris (если Iris ещё не настроен).
configurations {
	shaderpack { transitive = false }
}

dependencies {
	shaderpack "maven.modrinth:complementary-reimagined:${project.complementary_version}@zip"
}

def shaderpackFiles = configurations.shaderpack
def shaderpackName = "ComplementaryReimagined_${project.complementary_version}.zip"
def shaderpackDir = file("run/shaderpacks")
def irisConfigFile = file("run/config/iris.properties")

tasks.register("installShaderpack") {
	group = "tears of ink"
	description = "Скачивает Complementary Reimagined в run/shaderpacks и включает его в Iris"
	doLast { task ->
		try {
			File source = shaderpackFiles.singleFile
			shaderpackDir.mkdirs()
			File dest = new File(shaderpackDir, shaderpackName)
			java.nio.file.Files.copy(source.toPath(), dest.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
			if (!irisConfigFile.exists()) {
				irisConfigFile.parentFile.mkdirs()
				irisConfigFile.text = "enableShaders=true\nshaderPack=${shaderpackName}\n"
			}
			task.logger.lifecycle("Шейдерпак готов: ${dest}")
		} catch (Exception e) {
			task.logger.warn("Не удалось скачать шейдерпак автоматически (${e.message}). " +
					"Скачай Complementary Reimagined с modrinth.com вручную и положи .zip в run/shaderpacks.")
		}
	}
}
