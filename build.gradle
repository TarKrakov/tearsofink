plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	maven {
		name = "TerraBlender"
		url = "https://maven.minecraftforge.net/"
		content { includeGroup "com.github.glitchfiend" }
	}
	// JEI (Just Enough Items) — только API для сборки; сам JEI игрок ставит отдельно (он есть в сборке)
	maven {
		name = "BlameJared"
		url = "https://maven.blamejared.com/"
		content { includeGroup "mezz.jei" }
	}
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter { includeGroup "maven.modrinth" }
	}
}

loom {
	splitEnvironmentSourceSets()

	// сервер — в своей папке, чтобы его можно было запускать одновременно с клиентом (логи и миры не мешают друг другу)
	runs {
		server {
			runDir "run-server"
		}
	}

	mods {
		"tears-of-ink" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	configureDataGeneration {
		client = true
		modId = "tears-of-ink"
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"


	// JEI: мод собирается с его API, но не требует его — без JEI всё работает, с JEI появляются наши окна рецептов
	modCompileOnly "mezz.jei:jei-1.21.1-fabric-api:${project.jei_version}"
	modCompileOnly "mezz.jei:jei-1.21.1-common-api:${project.jei_version}"
	modLocalRuntime "mezz.jei:jei-1.21.1-fabric:${project.jei_version}"

	// Только для запуска из IntelliJ: Sodium + Iris, как в общей сборке.
	// В наш .jar и в зависимости мода они НЕ попадают.
	modLocalRuntime "maven.modrinth:sodium:${project.sodium_version}"
	modLocalRuntime "maven.modrinth:iris:${project.iris_version}"
	// Xaero's World Map: через Gradle не подключаем (теряется вложенная XaeroLib) —
	// .jar кладётся руками в папку run/mods (её IntelliJ подхватывает при запуске)
	// Библиотеки, которые Iris в обычной игре носит внутри себя, а при запуске из IntelliJ — нет
	localRuntime "org.anarres:jcpp:1.4.14"
	localRuntime "io.github.douira:glsl-transformer:2.0.1"
	localRuntime "org.antlr:antlr4-runtime:4.13.1"
}

processResources {
	// Author armor source is the runtime geometry; keep one editable source of truth.
	from('blockbench') {
		include '*_armor.bbmodel'
		into 'assets/tears-of-ink/armor_models'
	}
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

// Автотест на сервере (workflow smoke): команды консоли подаются через stdin
tasks.matching { it.name == 'runServer' }.configureEach {
	standardInput = System.in
}

// Generated derivative textures for battlefield props; all authored originals remain immutable.
def battlefieldAgedResources = layout.buildDirectory.dir('generated/battlefield-aged-resources')
tasks.register('generateBattlefieldAgedResources', Exec) {
    def authoredTextures = file('src/main/resources/assets/tears-of-ink/textures')
    inputs.file('tools/battlefield/GenerateAgedTextures.java')
    inputs.files(fileTree(authoredTextures) {
        include 'item/pale_longsword.png', 'item/pale_linear_greatsword.png',
                'item/blood_talvar.png', 'item/blood_dussak.png',
                'item/spire_torturer_greatsword.png', 'item/spire_roaring_axe.png',
                'item/spire_shadow_scimitar.png', 'item/spire_rapid_knife.png',
                'item/ram_shield.png', 'item/repel_shield.png',
                'item/mercy_shield.png', 'item/radiant_shield.png',
                'entity/pale_spearman.png', 'entity/pale_shieldbearer.png',
                'entity/pale_crossbowman.png'
    })
    outputs.dir(battlefieldAgedResources)
    commandLine new File(System.getProperty('java.home'), 'bin/java').absolutePath,
            file('tools/battlefield/GenerateAgedTextures.java').absolutePath,
            authoredTextures.absolutePath, battlefieldAgedResources.get().asFile.absolutePath
}
processResources {
    dependsOn tasks.named('generateBattlefieldAgedResources')
    from(battlefieldAgedResources)
}

apply from: "gradle/orion.gradle"
processResources {
    from('blockbench/troll_texture.png') { into 'assets/tears-of-ink/textures/entity' }
}
