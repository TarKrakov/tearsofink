name: D-060 physical and legacy validation
on:
  workflow_dispatch:
    inputs:
      island_seed:
        description: "Optional seed known to have a raised temple; isolated V3 + restart check"
        required: false
        type: string
        default: ''
  push:
    branches: [main]
    paths:
      - 'tools/tests/d060-physical/**'
      - '.github/workflows/d060-physical.yml'
permissions:
  contents: read
jobs:
  physical:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=2
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '25'
          cache: gradle
      - name: Unit-test exact block comparison
        run: python3 -m unittest discover -s tools/tests/d060-physical -p 'test_*.py'
      - name: Compare real V3 and V1 buildings and roads
        env:
          ISLAND_SEED: ${{ inputs.island_seed }}
        run: |
          if [ -n "$ISLAND_SEED" ]; then
            python3 -u tools/tests/d060-physical/run.py --island-seed "$ISLAND_SEED"
          else
            python3 -u tools/tests/d060-physical/run.py
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: d060-full-physical
          path: out/d060/
          if-no-files-found: warn
