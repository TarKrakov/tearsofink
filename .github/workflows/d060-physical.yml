name: D-060 physical and legacy validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/tests/d060-physical/**'
      - '.github/workflows/d060-physical.yml'
permissions:
  contents: read
jobs:
  physical:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=2
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '25'
      - name: Compare real V3 and V1 buildings and roads
        run: python3 -u tools/tests/d060-physical/run.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: d060-full-physical
          path: out/d060/
          if-no-files-found: warn
