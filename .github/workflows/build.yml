# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
          cache: gradle
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: validate advancement icon paths
        run: python3 tools/check_advancement_icons.py
      - name: validate chest loot progression
        run: python3 tools/check_chest_loot.py
      - name: validate roadside watchtower slots and road safeguards
        run: python3 tools/check_roadside_watchtowers.py
      - name: validate hunter equipment, saved IDs and retired recipes
        run: python3 tools/check_hunter_arsenal.py
      - name: validate personal slots, collectible diary and reserved lantern
        run: python3 tools/check_personal_lanterns.py
      - name: validate armor weights, progression and recipes
        run: python3 tools/check_armor_balance.py
      - name: validate food balance and soul composition
        run: |
          javac -d /tmp/toi-food-test src/main/java/com/tarkrakov/tearsofink/ink/FoodBalance.java tools/tests/FoodBalanceTest.java
          java -cp /tmp/toi-food-test FoodBalanceTest
      - name: validate equipment affinity and armor math
        run: |
          mkdir -p /tmp/toi-equipment-test
          javac -d /tmp/toi-equipment-test src/main/java/com/tarkrakov/tearsofink/world/EquipmentAffinity.java tools/tests/EquipmentAffinityTest.java
          java -cp /tmp/toi-equipment-test EquipmentAffinityTest
      - name: validate Blockbench workspace and automatic F5
        run: node tools/blockbench/test_workspace.js
      - name: validate final author scene and active Pale clip mapping
        run: node tools/blockbench/check_final_pale.js
      - name: validate authored armor BB models, texture names and item previews
        run: python3 tools/check_authored_armor.py
      - name: validate visible pale owl wingbeats without movement changes
        run: python3 tools/check_owl_flight.py
      - name: validate battlefield authored-bone decor and resource atlas
        run: python3 tools/battlefield/export_decor.py
      - name: validate authored battlefield banner UVs and untouched PNG
        run: python3 tools/battlefield/check_first_banner.py
      - name: validate deterministic battlefield zone recipes
        run: |
          mkdir -p /tmp/toi-battlefield-zone-test
          javac -d /tmp/toi-battlefield-zone-test src/main/java/com/tarkrakov/tearsofink/world/battlefield/BattlefieldSceneRecipes.java tools/tests/BattlefieldSceneRecipesTest.java
          java -cp /tmp/toi-battlefield-zone-test BattlefieldSceneRecipesTest
      - name: validate JABER two-level routing math
        run: |
          mkdir -p /tmp/toi-jaber-test
          javac -d /tmp/toi-jaber-test src/main/java/com/tarkrakov/tearsofink/compat/jaber/JaberPath.java tools/tests/JaberPathTest.java
          java -cp /tmp/toi-jaber-test JaberPathTest
      - name: build
        run: ./gradlew build
      # The original Claude previewer validates the real model/pivot and can render
      # synchronized first-person and F5 animations from the actual weapon JSON.
      - name: install preview dependencies
        run: |
          python3 -m venv /tmp/tearsofink-preview-venv
          /tmp/tearsofink-preview-venv/bin/pip install --quiet numpy pillow
      - name: verify authored Blockbench import against installed FP clips
        run: /tmp/tearsofink-preview-venv/bin/python tools/blockbench/check_author_import.py
      - name: validate animation positions via Claude preview
        run: /tmp/tearsofink-preview-venv/bin/python tools/preview/check_pale.py
      - name: validate first-person composition and compiled renderer
        run: /tmp/tearsofink-preview-venv/bin/python tools/preview/check_pale_fp.py --compiled
      - name: validate connected FP series and shared camera mount
        run: /tmp/tearsofink-preview-venv/bin/python tools/preview/check_pale_flow.py
      - name: validate retreat slash, flight preparation and idle composition
        run: /tmp/tearsofink-preview-venv/bin/python tools/preview/check_pale_moves.py
      - name: validate new Shift+R single and double guarding poses
        run: /tmp/tearsofink-preview-venv/bin/python tools/preview/check_pale_guard.py
      - name: validate paired attack handoffs
        run: /tmp/tearsofink-preview-venv/bin/python tools/preview/check_pale_sync.py
      - name: review clip curves and whole-model visibility
        run: /tmp/tearsofink-preview-venv/bin/python tools/preview/review.py pale_linear_greatsword --check-only
      - name: render three-view review sheets
        if: contains(github.event.head_commit.message, '[preview]')
        run: /tmp/tearsofink-preview-venv/bin/python tools/preview/review.py pale_linear_greatsword --render
      - name: upload review report and contact sheets
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: WeaponAnimationReview
          if-no-files-found: warn
          path: out/review/
      - name: render specialty R preview via Claude preview
        if: contains(github.event.head_commit.message, '[preview]')
        run: /tmp/tearsofink-preview-venv/bin/python tools/preview/pale.py out/pale pair-r
      - name: render guarded stances in first-person and F5
        if: contains(github.event.head_commit.message, '[preview]')
        run: /tmp/tearsofink-preview-venv/bin/python tools/preview/pale.py out/pale solo-guard dual-guard
      - name: save guard GIFs and contact sheets
        if: contains(github.event.head_commit.message, '[preview]')
        uses: actions/upload-artifact@v7
        with:
          name: PaleGreatswordShiftRGuardPreview
          path: |
            out/pale/solo-guard*.gif
            out/pale/solo-guard*.png
            out/pale/dual-guard*.gif
            out/pale/dual-guard*.png
      - name: save specialty R preview
        if: contains(github.event.head_commit.message, '[preview]')
        uses: actions/upload-artifact@v7
        with:
          name: PaleGreatswordSpecialtyPreview
          path: |
            out/pale/pair-r.gif
            out/pale/pair-r.png
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/
