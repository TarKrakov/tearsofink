# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      # The original Claude previewer validates the real model/pivot and can render
      # synchronized first-person and F5 animations from the actual weapon JSON.
      - name: install preview dependencies
        run: |
          python3 -m venv /tmp/tearsofink-preview-venv
          /tmp/tearsofink-preview-venv/bin/pip install --quiet numpy pillow
      - name: validate animation positions via Claude preview
        run: /tmp/tearsofink-preview-venv/bin/python tools/preview/check_pale.py
      - name: review clip curves and whole-model visibility
        run: /tmp/tearsofink-preview-venv/bin/python tools/preview/review.py pale_linear_greatsword --check-only
      - name: render three-view review sheets
        if: contains(github.event.head_commit.message, '[preview]')
        run: /tmp/tearsofink-preview-venv/bin/python tools/preview/review.py pale_linear_greatsword --render
      - name: upload review report and contact sheets
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: WeaponAnimationReview
          if-no-files-found: warn
          path: out/review/
      - name: render specialty R preview via Claude preview
        if: contains(github.event.head_commit.message, '[preview]')
        run: /tmp/tearsofink-preview-venv/bin/python tools/preview/pale.py out/pale pair-r
      - name: save specialty R preview
        if: contains(github.event.head_commit.message, '[preview]')
        uses: actions/upload-artifact@v7
        with:
          name: PaleGreatswordSpecialtyPreview
          path: |
            out/pale/pair-r.gif
            out/pale/pair-r.png
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/
