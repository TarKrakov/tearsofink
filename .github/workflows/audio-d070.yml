name: D-070 shieldbearer audio
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audio-d070.yml'
permissions:
  contents: write
jobs:
  render:
    if: contains(github.event.head_commit.message, 'Render D-070 once')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Prepare offline renderer
        run: |
          python3 -m venv /tmp/d070
          /tmp/d070/bin/pip install numpy scipy soundfile
      - name: Render and validate 13 recordings
        run: /tmp/d070/bin/python tools/audio/revise_shieldbearer.py
      - name: Check exact changed paths and document validated resources
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess
          report=json.loads(pathlib.Path('out/audio-d070.json').read_text())
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          expected={'src/main/resources/assets/tears-of-ink/sounds/'+r['file'] for r in report['changed']}
          assert changed==expected and len(changed)==13
          assert all(r['file'].startswith('pale_shield_') for r in report['changed'])
          with open('docs/PROJECT_STATUS.md','a') as f:
              f.write('\n### D-070 — Ресурсы щитоносца проверены\n')
              f.write('Заменены 13 OGG: два голоса покоя, боль, смерть, две подготовки, рык старта, таран по цели, пролом, стена, два удара щитом, оглушение. Голоса синтезированы неровным гортанным источником и формантами; столкновения — короткими непериодическими импульсами и затухающей массой, без ванильных сэмплов. Старт удлинён до минимум 0,72 с для рыка; другие длительности и частоты сохранены. Проверены моно Vorbis, конечность, пики, RMS, точный список изменённых файлов, SHA-256 всех остальных OGG. Сборка прошла до публикации. Громкости событий, микшер, AI, игровые тайминги и регистрация не менялись. Самостоятельное прослушивание и игровая приёмка не выполнены.\n')
          PY
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - name: Build revision
        run: bash ./gradlew build
      - name: Publish validated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/resources/assets/tears-of-ink/sounds/ docs/PROJECT_STATUS.md
          git commit -m "Render D-070 shieldbearer voice, roar and physical impacts; Gradle verified"
          git push origin HEAD:main
      - name: Upload per-file verification report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: D070-audio-validation
          path: out/audio-d070.json
