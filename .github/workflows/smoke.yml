# Ручной автотест: поднимает выделенный сервер, генерирует Чернильные Земли и проверяет дороги.
name: smoke
on: [workflow_dispatch]

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew
      - name: run server and checks
        run: |
          printf "max-tick-time=-1\n" >> run-server/server.properties
          {
            for i in $(seq 1 120); do
              sleep 5
              if grep -q "Done (" run-server/logs/latest.log 2>/dev/null; then break; fi
            done
            echo "tearsofink check start"
            for i in $(seq 1 120); do sleep 5; if [ "$(grep -c "\[check\] Старт" run-server/logs/latest.log 2>/dev/null)" -ge 2 ]; then break; fi; done
            echo "stop"
          } | ./gradlew runServer --console=plain 2>&1 | tee server.log | grep --line-buffered -E "\[check\]|nearest|Could not find|ERROR|Exception|Caused by|Done \(" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: server-log
          path: |
            server.log
            run-server/logs/
