name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 25 }
      - run: chmod +x gradlew && ./gradlew --no-daemon build -x test
      - name: javap targets
        run: |
          J=$(find ~/.gradle/caches .gradle -name "minecraft-clientOnly-*loom.mappings*.jar" 2>/dev/null | head -1); echo "JAR $J"
          for j in $J; do
            javap -p -c -classpath "$j" net.minecraft.client.renderer.entity.ItemRenderer 2>/dev/null | grep -n "ItemTransform.apply\|public void render(" | head
            javap -p -classpath "$j" net.minecraft.client.renderer.ItemInHandRenderer 2>/dev/null | grep renderArmWithItem
            javap -p -classpath "$j" net.minecraft.client.Minecraft 2>/dev/null | grep "startAttack\|continueAttack\|LocalPlayer player\|HitResult hitResult"
            javap -p -c -classpath "$j" net.minecraft.client.renderer.entity.layers.ItemInHandLayer 2>/dev/null | grep -n "renderArmWithItem\|renderItem\|translateToHand" | head
            javap -p -classpath "$j" net.minecraft.client.renderer.block.model.ItemTransforms 2>/dev/null | grep "getTransform\|firstPerson"
            javap -p -classpath "$j" net.minecraft.client.renderer.block.model.BakedQuad 2>/dev/null | grep "getVertices"
            javap -p -classpath "$j" net.minecraft.client.renderer.entity.ItemRenderer 2>/dev/null | grep "getModel"
          done
            javap -p -classpath "$j" net.minecraft.client.model.HumanoidModel 2>/dev/null | grep "setupAnim\|ModelPart\|attackTime\|setupAttackAnimation"
            javap -p -classpath "$j" net.minecraft.client.model.PlayerModel 2>/dev/null | grep "setupAnim"
      - name: javap common
        run: |
          find ~/.gradle/caches .gradle -name "minecraft-*.jar" 2>/dev/null | grep -i mappings | head
          for j in $(find ~/.gradle/caches .gradle -name "minecraft-*loom.mappings*.jar" 2>/dev/null); do
            echo "JAR $j"
            javap -p -classpath "$j" net.minecraft.world.entity.LivingEntity 2>/dev/null | grep "canAttack" || true
            javap -p -classpath "$j" net.minecraft.world.entity.Mob 2>/dev/null | grep "isSunBurnTick" || true
            javap -p -classpath "$j" net.minecraft.world.entity.ai.attributes.Attributes 2>/dev/null | grep " SCALE" || true
            javap -p -classpath "$j" net.minecraft.world.entity.OwnableEntity 2>/dev/null | grep "getOwnerUUID" || true
            javap -p -classpath "$j" net.minecraft.world.level.NaturalSpawner 2>/dev/null | grep "isValidPositionForMob" || true
            javap -p -classpath "$j" net.minecraft.client.renderer.blockentity.BeaconRenderer 2>/dev/null | grep "renderBeaconBeam" || true
            javap -p -c -classpath "$j" net.minecraft.client.renderer.entity.LivingEntityRenderer 2>/dev/null | grep "public void render(\|renderToBuffer" || true
            javap -p -classpath "$j" net.minecraft.client.model.PlayerModel 2>/dev/null | grep "createMesh\|PlayerModel(" || true
            javap -p -classpath "$j" net.minecraft.client.renderer.entity.HumanoidMobRenderer 2>/dev/null | grep "HumanoidMobRenderer(" || true
          done
          find ~/.gradle/caches -name "fabric-entity-events*.jar" | head -1 | xargs -I{} sh -c 'unzip -l {} | grep -i "ServerLivingEntityEvents"' || true
